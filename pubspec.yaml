name: awesome_datetime_picker
description: "A customizable date-time picker package supporting all platforms (ios, android, web, desktop, ...)."
version: 0.2.2
homepage: https://github.com/inesachour/awesome_datetime_picker
repository: https://github.com/inesachour/awesome_datetime_picker
issue_tracker: https://github.com/inesachour/awesome_datetime_picker/issues
screenshots:
  - description: 'A date-time picker being scrolled.'
    path: doc/images/demo.gif
  - description: 'Date picker with month names.'
    path: doc/images/date_picker.png
  - description: '12-hour time picker with 5-minute steps.'
    path: doc/images/time_picker.png
  - description: 'Date-time picker.'
    path: doc/images/datetime_picker.png
  - description: 'Date-range picker with check-in and check-out labels.'
    path: doc/images/date_range_picker.png
  - description: 'A date picker in a bottom sheet with Cancel and OK.'
    path: doc/images/modal_sheet.png
  - description: 'The date-time picker in dark mode.'
    path: doc/images/dark_mode.png
  - description: 'Weekends shown dimmed, with weekday labels.'
    path: doc/images/disabled_values.png
  - description: 'A time picker with a custom selector and curved wheels.'
    path: doc/images/wheel_style.png
  - description: 'Date pickers in French, Spanish and German.'
    path: doc/images/localization.png
topics:
  - datetime-picker
  - date-picker
  - time-picker
  - wheel
  - ios

environment:
  sdk: '>=3.3.1 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  intl: '>=0.19.0 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

