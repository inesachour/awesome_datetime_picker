name: Demo

# Builds the example app for the web and publishes it with GitHub Pages:
# https://<owner>.github.io/<repository>/
#
# One-time setup in the repository: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is running: let it finish, then the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      # The site lives in a sub-folder (/<repository>/), so the app needs its
      # base href.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
        working-directory: example
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
