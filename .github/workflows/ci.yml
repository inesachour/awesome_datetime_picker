name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or pull request makes the older run useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, analysis and the tests of the package, on Linux and macOS.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool example/lib example/test
      - run: flutter analyze
      - run: flutter test

  # The example app: it is the demo, and it exercises the package the way an
  # app does (a screen listening to a controller, switches that change the
  # options of the pickers).
  example:
    name: Example app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example

  # The check behind the "downgrade analysis" of pub.dev: the code must compile
  # and pass against the lowest version of every dependency that pubspec.yaml
  # allows (for example the oldest intl).
  downgrade:
    name: Lowest dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub downgrade
      - run: flutter analyze
      - run: flutter test

  # The package and the example compile for the web. The tests are also run in
  # a browser, which has different number and key handling than the VM: this
  # step is allowed to fail until it has been seen passing once on GitHub (it
  # could not be run where the workflow was written).
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Build the example for the web
        run: flutter build web --release
        working-directory: example
      - name: Run the tests in Chrome
        continue-on-error: true
        run: |
          flutter pub get
          flutter test --platform chrome

  # The images of the README and of pub.dev are generated from the real
  # widgets: they must keep generating. They are attached to the run so that a
  # change of look can be reviewed.
  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test tool/generate_screenshots_test.dart
      - name: Check that every image of the README was generated
        run: |
          for image in $(grep -ohE 'doc/images/[A-Za-z0-9_.-]+' README.md pubspec.yaml | sort -u); do
            test -s "$image" || { echo "missing or empty: $image"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: doc/images

  # What pub.dev checks before accepting a package: pubspec, screenshots,
  # size, documentation.
  publish-check:
    name: Publish dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run
